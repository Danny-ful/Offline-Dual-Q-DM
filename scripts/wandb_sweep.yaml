program: train_iq.py
name: hopper-full-replay
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - env=hopper
  - agent=sac
  - offline=True
  - env.expert_path=experts/hopper.pkl
  - env.supplement_path=supplement/hopper_full_replay-v2.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - train.batch=256
  - method.loss=value
  - method.constrain=True
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4 
  - agent.critic_tau=0.005 
  - num_actor_updates=1 
  - method.grad_pen=False
  - cliptarget=False
  - agent.learn_temp=False
  - schedular=False
  - cuda_deterministic=False
  - method.regularize=False
  - actor_expert_offline=False
  - project_name=Offline-Dual-Q-DM
  - exp_name=hopper_grid
  - method.uncertainty=False
  - method.penalty_auto=True
  - method.penalty_N=5
  - method.dynamics_ckpt=dynamics/hopper_full_replay-v2/ensemble_5.pt
  - ${args_no_hyphens}
  - q_net._target_=agent.sac_models.DoubleQCritic
  - env.learn_steps=6e5


parameters:
  seed:
    values: [0]

  left:
    values: [-1.2, -0.8]
  right:
    values: [1.2, 0.8]

  agent.init_temp:
    values: [1.0, 0.8]

  method.penalty_target:
    values: [5]

  method.alpha:
    values: [0.5]

  value_ratio:
    values: [1.0]

  agent.actor_lr:
    values: [6e-5, 3e-5]

  agent.actor_update_frequency:
    values: [1]

  method.penalty_lr:
    values: [1e-3]

  eval.stochastic:
    values: [False]

  method.chi:
    values: [True]

  method.synthetic_constrain:
    values: [False]

  method.synthetic_coef:
    values: [1.0]

  method.synthetic_warmup_steps:
    values: [10000]

  method.synthetic_M:
    values: [3]

  # method.div:
  #   values: [hellinger, kl, kl2, chi, js]