program: train_iq_robosuite.py
name: robosuite_lift_9.14
method: grid

metric:
  name: eval/success_rate
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - project_name=robosuite
  - robosuite.task=lift
  - robosuite.expert_dataset_type=ph
  - robosuite.expert_hdf5_type=low_dim
  - robosuite.expert_trajs=null
  - robosuite.supplement_dataset_type=mg
  - robosuite.supplement_hdf5_type=low_dim_sparse
  - robosuite.supplement_trajs=null
  - robosuite.use_supplement=true
  - robosuite.learn_steps=100000
  - robosuite.eval_interval=5000
  - robosuite.eval_episodes=100
  - robosuite.eval_on_env=true
  - eval.stochastic=false
  - method.synthetic_constrain=true
  - method.uncertainty=true
  - method.dynamics_ckpt=dynamics/robosuite/lift/ph_low_dim__mg_low_dim_sparse/ensemble_5.pt
  - ${args_no_hyphens}

parameters:
  method.synthetic_coef:
    values: [2.0]

  method.synthetic_warmup_steps:
    values: [1, 10000]

  train.batch:
    values: [256]

  method.alpha:
    values: [0.5]

  agent.actor_lr:
    values: [3e-5, 6e-5]

  agent.critic_lr:
    values: [1e-4, 3e-4]

  agent.init_temp:
    values: [0.5, 0.3]

  seed:
    values: [0]

  method.penalty_coef:
    values: [0.5]

  method.penalty_target:
    values: [5]

