program: train_iq_noisy_expert.py
name: noisy-expert-iq-sweep-ant
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - env=ant
  - agent=sac
  - offline=True
  - env.expert_path=experts/ant.pkl
  - env.supplement_path=supplement/ant_noisy_expert.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - train.batch=256
  - method.loss=value
  - method.constrain=True
  - method.synthetic_constrain=True
  - method.synthetic_M=1
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4
  - agent.critic_tau=0.005
  - num_actor_updates=1
  - method.grad_pen=False
  - cliptarget=False
  - agent.learn_temp=False
  - schedular=False
  - cuda_deterministic=False
  - method.regularize=False
  - actor_expert_offline=True
  - project_name=Offline-Dual-Q-DM-Noisy-Expert-ant
  - exp_name=noisy_expert_ant
  - method.uncertainty=True
  - method.penalty_auto=False
  - method.penalty_N=5
  - method.dynamics_ckpt=dynamics/ant_noisy_expert/ensemble_5.pt
  - ${args_no_hyphens}
  - q_net._target_=agent.sac_models.DoubleQCritic
  - env.learn_steps=5e5


parameters:
  method.synthetic_coef:
    values: [0.1]

  method.synthetic_warmup_steps:
    values: [10000]

  seed:
    values: [0]

  left:
    values: [-1, -1.5]
  right:
    values: [1.2, 1.0]

  agent.init_temp:
    values: [0.3,0.25,0.2,0.15,0.1]

  method.penalty_target:
    values: [5]

  method.alpha:
    values: [0.5]

  value_ratio:
    values: [0.5]

  agent.actor_lr:
    values: [6e-5,7e-5,8e-5]

  agent.actor_update_frequency:
    values: [1]

  method.penalty_lr:
    values: [1e-3]

  eval.stochastic:
    values: [False]

  method.chi:
    values: [True]
