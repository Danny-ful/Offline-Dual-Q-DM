program: train_iq_robosuite.py
name: can-penalty-grid
method: grid

metric:
  name: eval/success_rate
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - project_name=robosuite
  # Keep the experiment setup identical to run_robosuite_experiments.sh.
  - robosuite.task=can
  - robosuite.expert_dataset_type=ph
  - robosuite.expert_hdf5_type=low_dim
  - robosuite.expert_trajs=null
  - robosuite.supplement_dataset_type=mg
  - robosuite.supplement_hdf5_type=low_dim_sparse
  - robosuite.supplement_trajs=null
  - robosuite.use_supplement=true
  - robosuite.learn_steps=200000
  - robosuite.eval_interval=5000
  - robosuite.eval_episodes=100
  - robosuite.eval_on_env=true
  - eval.stochastic=false
  - agent.learn_temp=false
  - method.constrain=true
  - method.synthetic_constrain=False
  - method.synthetic_M=1
  # Set a dynamics checkpoint matching the HDF5 observation layout before enabling synthetic.
  - method.dynamics_ckpt=dynamics/robosuite/can/ph_low_dim__mg_low_dim_sparse/ensemble_5.pt
  - ${args_no_hyphens}

parameters:
  method.synthetic_coef:
    values: [0.1]

  method.synthetic_warmup_steps:
    values: [10000]

  # Training configuration. The baseline batch size is included.
  train.batch:
    values: [256]

  # IQ-Learn hyperparameters
  method.alpha:
    values: [0.5, 0.7]

  agent.actor_lr:
    values: [1e-5, 6e-5]

  agent.critic_lr:
    values: [1e-4, 5e-5]

  agent.init_temp:
    values: [0.1,0.4]

  method.synthetic_constrain:
    values: [True, False]

  method.uncertainty:
    values: [True, False]

  # Seeds for reproducibility
  seed:
    values: [0]
