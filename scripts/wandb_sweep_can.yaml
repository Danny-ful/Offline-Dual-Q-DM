program: train_iq_robosuite.py
name: can-penalty-false-grid
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - robosuite.task=can
  - agent=sac
  - offline=True
  - robosuite.expert_dataset_type=ph
  - robosuite.expert_hdf5_type=low_dim
  - robosuite.supplement_dataset_type=mg
  - robosuite.supplement_hdf5_type=low_dim_sparse
  - robosuite.supplement_trajs=null
  - robosuite.use_supplement=true
  - robosuite.expert_trajs=1
  - train.batch=256
  - method.loss=value
  - method.constrain=True
  - method.synthetic_constrain=False
  - method.synthetic_M=1
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4
  - agent.critic_tau=0.005
  - num_actor_updates=1
  - method.grad_pen=False
  - cliptarget=False
  - agent.learn_temp=False
  - schedular=False
  - cuda_deterministic=False
  - method.regularize=False
  - actor_expert_offline=False
  - project_name=Offline-Dual-Q-DM
  - exp_name=penalty_false_can_grid
  - method.uncertainty=False
  - method.penalty_auto=True
  - method.penalty_N=5
  # Set a dynamics checkpoint matching the HDF5 observation layout before enabling synthetic.
  - method.dynamics_ckpt=
  - ${args_no_hyphens}
  - q_net._target_=agent.sac_models.DoubleQCritic
  - robosuite.learn_steps=200000


parameters:
  method.synthetic_coef:
    values: [0.1]

  method.synthetic_warmup_steps:
    values: [10000]

  seed:
    values: [0]

  left:
    values: [-1.2, -0.8]
  right:
    values: [1.2, 0.8]

  agent.init_temp:
    values: [0.5, 0.4]

  method.penalty_target:
    values: [5]

  method.alpha:
    values: [0.5]

  value_ratio:
    values: [1.0, 0.8]

  agent.actor_lr:
    values: [6e-5, 3e-5]

  agent.actor_update_frequency:
    values: [1]

  method.penalty_lr:
    values: [1e-3]

  eval.stochastic:
    values: [False]

  method.chi:
    values: [True]

  # method.div:
  #   values: [hellinger, kl, kl2, chi, js]
