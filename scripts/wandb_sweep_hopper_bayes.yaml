program: train_iq.py
name: hopper-offline-stability-bayes
method: bayes

metric:
  name: eval/episode_reward
  goal: maximize

early_terminate:
  type: hyperband
  min_iter: 8
  eta: 2

command:
  - ${env}
  - python
  - ${program}
  - env=hopper
  - agent=sac
  - offline=True
  - env.demo=Hopper-v2_d4rl.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - method.loss=value
  - method.constrain=True
  - train.use_target=True
  - train.soft_update=True
  - cliptarget=True
  - schedular=False
  - method.grad_pen=True
  - project_name=Offline-Dual-Q-DM
  - exp_name=sweep_hopper_bayes
  - ${args_no_hyphens}

parameters:
  seed:
    values: [0]

  # Critic stability knobs
  train.batch:
    values: [512]
  agent.critic_lr:
    values: [1e-4, 2e-4, 5e-4]
  agent.critic_tau:
    values: [0.001, 0.1, 1.0]

  # Actor pace knobs
  agent.actor_lr:
    values: [1e-5, 2e-5, 5e-5]
  agent.actor_update_frequency:
    values: [1, 2]
  num_actor_updates:
    values: [1, 2]

  # IQ constraint knobs
  penalty:
    values: [5, 10, 15]
  left:
    values: [-1, -0.9]
  right:
    values: [1, 0.9]

  method.lambda_gp:
    values: [10]

  # Temporal credit assignment
  # gamma:
  #   values: [0.98, 0.99]
