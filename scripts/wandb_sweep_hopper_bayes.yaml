program: train_iq.py
name: halfcheetah-offline-stability-grid
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - env=cheetah
  - agent=sac
  - offline=True
  - env.demo=halfcheetah_full_replay-v2.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - train.batch=512
  - method.loss=value
  - method.constrain=True
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4 
  - agent.critic_tau=0.005 
  - num_actor_updates=1 
  - method.grad_pen=False
  - cliptarget=False
  - agent.learn_temp=False
  - schedular=False
  - cuda_deterministic=False
  - method.regularize=False
  - method.chi=True
  - actor_expert_offline=False
  - project_name=Offline-Dual-Q-DM
  - exp_name=sweep_halfcheetah_grid
  - method.penalty=True
  - method.penalty_auto=True
  - method.penalty_N=5
  - method.dynamics_ckpt=dynamics/HalfCheetah-v2/ensemble_5.pt
  - ${args_no_hyphens}
  - q_net._target_=agent.sac_models.DoubleQCritic


parameters:
  seed:
    values: [0]

  left:
    values: [-1.5, -2.0, -1.0]
  right:
    values: [1.0, 1.5]

  agent.init_temp:
    values: [0.5]

  method.penalty_target:
    values: [5]

  method.alpha:
    values: [0.5, 0.75]

  value_ratio:
    values: [1.0]

  agent.actor_lr:
    values: [6e-5]

  agent.actor_update_frequency:
    values: [1]

  method.penalty_lr:
    values: [5e-3, 1e-2]

  method.penalty_coef:
    values: [0.1, 0.2]