program: train_iq_noisy_expert.py
name: halfcheetah_uncertainty_sync
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - env=cheetah
  - agent=sac
  - offline=True
  - env.expert_path=experts/halfcheetah.pkl
  - env.supplement_path=supplement/halfcheetah_medium_expert-v2.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - train.batch=256
  - method.loss=value
  - method.constrain=True
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4
  - agent.critic_tau=0.005
  - num_actor_updates=1
  - method.grad_pen=False
  - cliptarget=False
  - agent.learn_temp=False
  - cuda_deterministic=False
  - method.regularize=False
  - actor_expert_offline=False
  - project_name=Offline-Dual-Q-DM-medium-Expert-halfcheetah
  - exp_name=medium_expert_halfcheetah
  - method.uncertainty=True
  - method.synthetic_constrain=True
  - method.synthetic_M=1
  - method.penalty_auto=True
  - method.penalty_N=5
  - method.dynamics_ckpt=dynamics/halfcheetah_medium_expert-v2/ensemble_5.pt
  - ${args_no_hyphens}
  - q_net._target_=agent.sac_models.DoubleQCritic
  - env.learn_steps=8e5


parameters:
  method.synthetic_coef:
    values: [1, 3]

  method.synthetic_warmup_steps:
    values: [100000,20000]

  seed:
    values: [0]

  left:
    values: [-1]
  right:
    values: [1]

  agent.init_temp:
    values: [0.9,0.95]

  method.penalty_target:
    values: [5,1]

  method.alpha:
    values: [0.5]

  value_ratio:
    values: [1]

  agent.actor_lr:
    values: [1e-4]

  actor_lr_scheduler.enabled:
    values: [True,False]

  actor_lr_scheduler.final_lr:
    values: [3e-6]

  actor_lr_scheduler.anneal_updates:
    values: [300000]

  agent.actor_update_frequency:
    values: [1]

  method.penalty_lr:
    values: [5e-3]

  eval.stochastic:
    values: [False]

  method.chi:
    values: [True]

  method.penalty_coef:
    values: [0.3]