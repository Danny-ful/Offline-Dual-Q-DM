program: train_iq.py
name: hopper-offline-stability-grid
method: grid

metric:
  name: eval/episode_reward
  goal: maximize

command:
  - ${env}
  - python
  - ${program}
  - env=hopper
  - agent=sac
  - offline=True
  - env.demo=Hopper-v2_d4rl.pkl
  - expert.demos=1
  - expert.subsample_freq=1
  - method.loss=value
  - method.constrain=True
  - train.use_target=True
  - train.soft_update=True
  - agent.critic_lr=3e-4 
  - agent.critic_tau=0.005 
  - agent.actor_lr=3e-5 
  - agent.actor_update_frequency=1 
  - num_actor_updates=1 
  - method.grad_pen=False
  - cliptarget=False
  - schedular=False
  - cuda_deterministic=True
  - project_name=Offline-Dual-Q-DM
  - exp_name=sweep_hopper_grid
  - method.penalty=True
  - method.penalty_auto=True
  - method.penalty_lr=1e-2
  - method.penalty_N=5
  - method.dynamics_ckpt=dynamics/Hopper-v2/ensemble_5.pt
  - ${args_no_hyphens}

parameters:
  seed:
    values: [0]

  left:
    values: [-2.0, -1.5, -1.0]
  right:
    values: [1.0, 0.8]

  agent.init_temp:
    values: [0.5, 1.0, 0.1]

  method.penalty_target:
    values: [5, 3]