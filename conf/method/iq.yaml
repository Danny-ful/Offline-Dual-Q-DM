# @package _global_

method:
  type: iq
  loss: value # v0

  constrain: False
  grad_pen: False
  chi: False
  tanh: False
  regularize: False
  div:

  cql: False
  cql_alpha: 1.0
  cql_temp: 1.0
  cql_n_actions: 10

  alpha: 0.5
  lambda_gp: 10
  mix_coeff: 1

  # Dynamics penalty: penalty_coef * gamma * (1-done) * Std_i(E_M[min_k Q_k^-])
  # Dynamics and actor base noises are shared across ensemble members.
  uncertainty: False
  penalty_auto: False  # updated once per critic step, using mean head violation
  penalty_target: 0.0
  penalty_lr: 0.01
  penalty_min: 0.0
  penalty_max: 1e4
  penalty_coef: 0.1
  penalty_N: 5        # ensemble size (must match train_dynamics.py)
  penalty_M: 10       # samples per ensemble member; validate with fixed-batch M diagnostics
  dynamics_ckpt: ''   # e.g. dynamics/hopper/ensemble_5.pt

  # Fresh one-step model transitions from batch states and current actor actions.
  # Independent of penalty / penalty_auto; no persistent synthetic replay buffer.
  synthetic_constrain: False
  synthetic_M: 1  # next-state samples per member, independent of penalty_M
  synthetic_coef: 0.1
  synthetic_warmup_steps: 10000
