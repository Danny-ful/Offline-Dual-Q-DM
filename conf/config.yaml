exp_name: ''
project_name: ${env.name}

cuda_deterministic: False
device: ??? # to be specified later

gamma: 0.99
seed: 0
pretrain: null
left: -1 
right: 1
penalty: 10
cliptarget: false
usereal: false
schedular: false
value_ratio: 1
num_seed_steps: 0 # Don't need seeding for IL (Use 1000 for RL)
only_expert_states: False

train:
  batch: 256
  use_target: True
  soft_update: True

expert:
  demos: 1
  subsample_freq: 1

eval:
  policy:
  threshold:
  use_baselines: False
  eps: 10
  transfer: False
  expert_env: ''
  stochastic: False

env:
  replay_mem: 50000
  initial_mem: 1280
  eps_steps: 1000
  eps_window: 100
  learn_steps: 5e5
  eval_interval: 1e4
  expert_path: ''       # e.g. experts/hopper_expert_v2.pkl
  supplement_path: ''   # e.g. supplement/hopper_noisy_expert.pkl

  # use pixels
  from_pixels: False


# Extra args
log_interval: 100  # Log every this many steps
log_dir: logs/
save_interval: 5 # Save networks every this many epochs
hydra_base_dir: ""
eval_only: False

# Do offline learning
offline: False
# In offline IQ, update actor using only expert observations by default.
actor_expert_offline: True
# Add behavior cloning regularization to SAC actor updates on expert batches.
actor_bc: False
actor_bc_coef: 1.0
# Number of actor updates per env step
num_actor_updates: 1

dyn:
  N: 5
  epochs: 150
  batch_size: 256
  lr: 1e-3
  weight_decay: 1e-5
  hidden_dim: 256
  hidden_depth: 3
  val_frac: 0.05  # Fraction of whole trajectories per source (singletons stay in train)
  normalization_eps: 1e-6
  diagnostic_bins: 10
  log_interval: 5

defaults:
  - _self_
  - method: iq
  - agent: softq
  - env: cartpole
